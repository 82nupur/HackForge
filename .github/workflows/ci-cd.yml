name: HackForge CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"
      - "demo/**"
  
  pull_request:
    branches:
      - main

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flake8
        run: python -m flake8 app.py tests


  test:
    name: Test
    runs-on: ubuntu-latest

    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest


  docker:
    name: Docker Build and Health Check
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hackforge .

      - name: Run Docker container
        run: |
          docker run -d --name hackforge-container -p 5000:5000 hackforge

      - name: Wait for application
        run: sleep 5

      - name: Health smoke test
        run: curl --fail http://localhost:5000/health

      - name: Stop Docker container
        if: always()
        run: docker stop hackforge-container || true


  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deployment
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"